services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrispace
      POSTGRES_USER: agrispace
      POSTGRES_PASSWORD: agrispace
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agrispace:agrispace@db:5432/agrispace
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before deployment}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      NASA_POWER_ENABLED: ${NASA_POWER_ENABLED:-false}
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    image: node:24-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  postgres_data:
